name: CandleLab
options:
  bundleIdPrefix: com.candlelab
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: 1,2
targets:
  CandleLab:
    type: application
    platform: iOS
    sources:
    - Sources
    - WidgetShared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.candlelab.study
        INFOPLIST_FILE: Support/AppInfo.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
    - target: CandleLabWidget
      embed: true
  CandleLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: CandleLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  CandleLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    - WidgetTests/WidgetIntegrationTests.swift
    dependencies:
    - target: CandleLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  CandleLabWidget:
    type: app-extension
    platform: iOS
    sources:
    - WidgetShared
    - WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.candlelab.study.widget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Support/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
  CandleLabWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - WidgetTests/WidgetTests.swift
    dependencies:
    - target: CandleLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.candlelab.study.widgettests
schemes:
  CandleLab:
    build:
      targets:
        CandleLab: all
    test:
      targets:
      - CandleLabTests
      - CandleLabUITests
      - CandleLabWidgetTests
